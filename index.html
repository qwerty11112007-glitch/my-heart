<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Наступна станція — моє серце</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  height: 100vh;
  background: black;
  display: flex;
  align-items: center;
  overflow: hidden;
  color: #ffe600;
  font-family: monospace;
}
.window {
  width: 100%;
  overflow: hidden;
  white-space: nowrap;
}
.text {
  display: inline-block;
  padding-left: 100%;
  font-size: clamp(25px, 6vw, 58px);
  font-weight: bold;
  letter-spacing: 3px;
  animation: scroll 22s linear infinite;
}
@keyframes scroll {
  from { transform: translateX(0); }
  to { transform: translateX(-100%); }
}
.exit {
  position: fixed;
  top: 10px;
  right: 12px;
  color: #ffe600;
  background: none;
  border: none;
  font-size: 24px;
}
</style>
</head>
<body>
<button class="exit" onclick="history.back()">×</button>
<div class="window">
  <div class="text">
    ОБЕРЕЖНО ДВЕРІ ЗАЧИНЯЮТЬСЯ. НАСТУПНА СТАНЦІЯ - МОЄ СЕРЦЕ.
    &nbsp;&nbsp;&nbsp;
    ОБЕРЕЖНО ДВЕРІ ЗАЧИНЯЮТЬСЯ. НАСТУПНА СТАНЦІЯ - МОЄ СЕРЦЕ.
  </div>
</div>
</body>
</html>
